[project]
name = "tirgum"
version = "0.1.0"
description = "Tirgum: English subtitles for Hebrew YouTube videos"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.141.1",
    "faster-whisper>=1.1",
    "google-genai>=2.25.0",
    "ivrit>=0.2.6",
    "pillow>=12.3.0",
    "pydantic>=2",
    "uvicorn[standard]>=0.53.0",
    "yt-dlp>=2025.1.1",
]

[project.scripts]
tirgum = "tirgum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tirgum"]
